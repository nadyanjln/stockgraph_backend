[project]
name = "stockgraph"
version = "0.1.0"
description = "StockGraph Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.115.0",
    "feedparser>=6.0.12",
    "googlenewsdecoder>=0.1.7",
    "graphrag-sdk[litellm]>=1.0.1",
    "matplotlib>=3.9.0",
    "openai>=2.33.0",
    "onnxruntime>=1.18.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pypdf>=5.9.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "requests>=2.33.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
